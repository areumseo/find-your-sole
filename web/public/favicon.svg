<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 6 108 108" width="480" height="480" role="img" aria-labelledby="t d">
  <title id="t">Soli · 기본형</title>
  <desc id="d">어서 와, 같이 골라보자. 왼팔을 옆 아래로 부드럽게 내밀고 오른손을 흔드는 기본 자세.</desc>
  <!--
    Soli mascot. Everything is vector paths; no embedded images.
    Layers: shoes -> outline (navy) -> fill (cream) -> face.
    The right arm (waving) is part of the body path. The left arm is a separate rounded capsule:
    to change its pose edit the SAME path data in both "soli-default-arm-left-outline" and "soli-default-arm-left-fill".
    Colors: navy #142b37, cream #fbf8f2, blue #4ba4d8. Outline is 15 design units = 2.85 here.
  -->
