<svg xmlns="http://www.w3.org/2000/svg" viewBox="6 16 110 92" role="img" aria-label="Find Your Sole">
  <title>Find Your Sole</title>
  <!-- ground shadow -->
  <ellipse cx="60" cy="103" rx="40" ry="4.5" fill="#12384f" opacity="0.1"/>

  <!-- sprout on the collar -->
  <path d="M45 34 C44 26 49 20 58 20 C58 28 53 33 45 34 Z" fill="#56c786" stroke="#1f5f86" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- upper: the body of the character -->
  <path d="M15 86 C13 62 21 38 39 34 C46 32.5 51.5 35 55.5 41 C61.5 50 73.5 54 90 59 C103 63 108 74 106 86 Z"
        fill="#4aabdb" stroke="#1f5f86" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- soft highlight along the heel -->
  <path d="M25 48 C28 41 33 38 38 38" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>

  <!-- laces -->
  <g stroke="#ffffff" stroke-width="3.2" stroke-linecap="round">
    <path d="M60 46 l-3.5 7"/>
    <path d="M70 51 l-3.5 7"/>
    <path d="M80 55.5 l-3.5 7"/>
  </g>

  <!-- midsole -->
  <path d="M11 86 H107 Q113 86 113 92 Q113 100 103 100 H21 Q9 100 9 92 Q9 86 11 86 Z"
        fill="#ffffff" stroke="#1f5f86" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M19 93.5 H101" stroke="#bfe6f7" stroke-width="3" stroke-linecap="round"/>

  <!-- face (kept large so it still reads at favicon size) -->
  <g fill="#12384f">
    <ellipse cx="43" cy="68" rx="5.4" ry="6.6"/>
    <ellipse cx="65" cy="68" rx="5.4" ry="6.6"/>
  </g>
  <g fill="#ffffff">
    <circle cx="44.8" cy="65.6" r="2.1"/>
    <circle cx="66.8" cy="65.6" r="2.1"/>
  </g>
  <path d="M49.5 76 Q54 81.5 58.5 76" fill="none" stroke="#12384f" stroke-width="3.4" stroke-linecap="round"/>
  <g fill="#ff9db0" opacity="0.9">
    <ellipse cx="34.5" cy="76" rx="5.2" ry="3.4"/>
    <ellipse cx="73.5" cy="76" rx="5.2" ry="3.4"/>
  </g>
</svg>
