<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- Apply a saved light/dark choice before first paint so there is no flash of the other theme. -->
    <script>
      try {
        var t = localStorage.getItem('fys.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <meta name="theme-color" content="#4aabdb" />

    <title>Find Your Sole · 신발 추천</title>
    <meta
      name="description"
      content="러닝화부터 워킹·데일리 신발까지, 내 발과 생활에 맞는 신발을 추천받으세요. 초심자도 쉽게, 경험자는 정밀하게. 추천 이유는 AI가 설명해 드립니다."
    />

    <link rel="canonical" href="https://findyoursole.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://findyoursole.app/" />
    <meta property="og:site_name" content="Find Your Sole" />
    <meta property="og:title" content="Find Your Sole · 신발 추천" />
    <meta
      property="og:description"
      content="내 발과 생활에 딱 맞는 러닝화·워킹화를 솔이와 함께 골라 보세요."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "url": "https://findyoursole.app/",
        "name": "Find Your Sole",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "Any",
        "inLanguage": ["ko", "en"],
        "description": "Personalized running, walking and everyday shoe recommendations based on foot type, lifestyle and budget.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "KRW" }
      }
    </script>
  </head>
  <body>
    <!--
      Static content for crawlers and for the moment before the script runs.
      main.ts replaces everything inside #app on boot.
    -->
    <div id="app">
      <header class="topbar"><div class="brand"><img class="brand-logo" src="/logo.svg" alt="" width="40" height="40" /><span class="brand-name">Find Your <br /><b>Sole</b></span></div></header>
      <main>
        <h1 class="lead">내 발에 딱 맞는 한 켤레, 같이 찾아요</h1>
        <p class="lead">
          발 아치, 프로네이션, 지면, 쿠션 선호도, 발볼, 예산을 반영해 러닝화와 워킹·데일리
          신발을 추천해 드립니다.
        </p>
        <noscript><p>이 앱을 사용하려면 JavaScript가 필요합니다. / This app requires JavaScript.</p></noscript>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
