<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#4aabdb" />

    <title>Find Your Sole · 러닝화 추천</title>
    <meta
      name="description"
      content="발 아치, 프로네이션, 지면, 예산에 맞는 러닝화를 추천받으세요. 초심자도 쉽게, 경험자는 정밀하게. 추천 이유는 AI가 설명해 드립니다."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Find Your Sole" />
    <meta property="og:title" content="Find Your Sole · 러닝화 추천" />
    <meta
      property="og:description"
      content="발 모양과 러닝 스타일에 맞는 러닝화를 추천받아 보세요."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Find Your Sole",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "Any",
        "inLanguage": ["ko", "en"],
        "description": "Personalized running shoe recommendations based on foot type, running style and budget.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "KRW" }
      }
    </script>
  </head>
  <body>
    <!--
      Static content for crawlers and for the moment before the script runs.
      main.ts replaces everything inside #app on boot.
    -->
    <div id="app">
      <header class="topbar"><div class="brand"><img class="brand-logo" src="/logo.svg" alt="" width="40" height="40" /><span class="brand-name">Find Your <br /><b>Sole</b></span></div></header>
      <main>
        <h1 class="lead">나에게 맞는 러닝화 찾기</h1>
        <p class="lead">
          발 아치, 프로네이션, 지면, 쿠션 선호도, 발볼, 주간 거리, 예산을 반영해 러닝화를
          추천해 드립니다.
        </p>
        <noscript><p>이 앱을 사용하려면 JavaScript가 필요합니다. / This app requires JavaScript.</p></noscript>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
