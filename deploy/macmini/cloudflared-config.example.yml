# Copy to /etc/cloudflared/config.yml after `cloudflared tunnel create find-your-sole`.
# Replace <TUNNEL_ID> with the id that command printed. The credentials file holds
# a secret: keep it out of Git.
tunnel: <TUNNEL_ID>
credentials-file: /etc/cloudflared/<TUNNEL_ID>.json

ingress:
  - hostname: api.findyoursole.app
    service: http://127.0.0.1:8000
  - service: http_status:404
