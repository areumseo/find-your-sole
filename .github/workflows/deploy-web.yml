name: Deploy web

on:
  push:
    branches: [main]
    # The web build only depends on the Flutter app, so skip deploys for
    # backend-only and tooling-only changes.
    paths:
      - 'flutter_app/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push supersedes an in-flight deploy, but let the running one finish
# so Pages is never left half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Pin to the version the app is developed against. See tools/README.md.
          flutter-version: 3.47.4
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      # Pages serves the project site from /<repo>/, so the bundle has to know
      # its base path or every asset request 404s. Drop this when a custom
      # domain serves the site from the root.
      - name: Build web
        run: flutter build web --release --base-href=/${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: flutter_app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
