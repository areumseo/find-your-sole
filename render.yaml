services:
  - type: web
    name: find-your-sole-api
    runtime: python
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      # Shoe launch news (optional): without these, /news returns an empty list.
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
      # Feedback inbox. DATABASE_URL is a Postgres URL (e.g. Neon); without it feedback is
      # kept in memory and lost on restart. ADMIN_TOKEN opens #/admin; without it admin is off.
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TOKEN
        sync: false
    healthCheckPath: /health

  # Static frontend. Built from web/ and served from Render's CDN; it talks to
  # the API service above over HTTPS (see VITE_API_URL in web/.env.example).
  - type: web
    name: find-your-sole-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      # Vite fingerprints everything under /assets, so it is safe to cache forever.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
