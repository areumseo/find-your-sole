<!DOCTYPE html>
<html lang="ko">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="발 모양과 러닝 스타일에 맞는 러닝화를 추천받아 보세요. 아치, 프로네이션, 지면, 예산을 반영한 맞춤 추천.">
  <meta name="theme-color" content="#4AABDB">

  <!-- Open Graph, so shared links show something useful. -->
  <meta property="og:title" content="Find Your Sole">
  <meta property="og:description" content="발 모양과 러닝 스타일에 맞는 러닝화를 추천받아 보세요.">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Find Your Sole">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Find Your Sole · 러닝화 추천</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* The Flutter bundle takes a few seconds to download and boot, especially
       on mobile networks. Without this the user stares at a white page, so
       paint a themed splash immediately and let Flutter remove it. */
    html, body { margin: 0; height: 100%; background: #F8F8F8; }
    @media (prefers-color-scheme: dark) {
      html, body { background: #121212; }
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      font: 500 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #4AABDB;
    }
    #loading img { width: 72px; height: 72px; border-radius: 16px; }
    #loading .spinner {
      width: 22px;
      height: 22px;
      border: 2px solid rgba(74, 171, 219, 0.25);
      border-top-color: #4AABDB;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      #loading .spinner { animation-duration: 2.4s; }
    }
  </style>
</head>
<body>
  <div id="loading">
    <img src="icons/Icon-192.png" alt="Find Your Sole">
    <div class="spinner"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
